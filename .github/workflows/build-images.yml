name: build-redknot-sglang-images

# Builds the two SGLang+RedKnot images and pushes to ghcr.io/almogtavor.
#   redknot-sglang     : this fork overlaid via PYTHONPATH (--attention-backend redknot)
#                        -> modes sglang-redknot-mw, sglang-redknot
#   redknot-sglang-off : pristine stock sglang base, no overlay (dense baseline)
#                        -> mode sglang-redknot-off
# Runs on push to build-images / main, or manually via the Actions tab.
on:
  push:
    branches: [main, build-images]
    paths:
      - "Dockerfile.redknot"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag"
        default: "latest"
      sglang_base:
        description: "base sglang image"
        default: "lmsysorg/sglang:latest"

env:
  REGISTRY: ghcr.io
  OWNER: almogtavor
  TAG: ${{ github.event.inputs.tag || 'latest' }}
  SGLANG_BASE: ${{ github.event.inputs.sglang_base || 'lmsysorg/sglang:latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redknot-sglang       # this fork overlaid (RedKnot ON path available)
            overlay: "true"
          - name: redknot-sglang-off   # pristine stock sglang (dense baseline)
            overlay: "false"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Pick Dockerfile
        run: |
          if [ "${{ matrix.overlay }}" = "true" ]; then
            echo "DOCKERFILE=Dockerfile.redknot" >> "$GITHUB_ENV"
          else
            # OFF baseline: pristine sglang + only the OpenShift /root UID fix.
            cat > Dockerfile.redknot-off <<'EOF'
          ARG SGLANG_BASE=lmsysorg/sglang:latest
          FROM ${SGLANG_BASE}
          ENV REDKNOT_ENABLED=0
          RUN chmod -R a+rX /root 2>/dev/null || true
          ENV HOME=/tmp
          ENV CARGO_HOME=/tmp/.cargo
          ENV XDG_CACHE_HOME=/tmp/.cache
          EOF
            echo "DOCKERFILE=Dockerfile.redknot-off" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            SGLANG_BASE=${{ env.SGLANG_BASE }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ env.TAG }}
          provenance: false
